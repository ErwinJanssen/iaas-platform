global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: "control-plane"
    static_configs:
      - targets: ["control-plane:8001"]

  - job_name: "failover-manager"
    static_configs:
      - targets: ["failover-manager:8002"]

  - job_name: "nats"
    static_configs:
      - targets: ["nats:8222"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]

  - job_name: "minio"
    static_configs:
      - targets: ["minio:9000"]
