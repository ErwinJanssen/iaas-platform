# Podman Compose Configuration for IaaS Platform Development
# Hybrid Architecture - Uses existing tools (Crossplane, NATS, etc.)
#
# Run with: podman-compose -f deploy/podman-compose/podman-compose.dev.yml up -d
#
# Note: Crossplane requires Kubernetes, so for local development we use:
# - Kind (Kubernetes in Docker) for Crossplane
# - All other services run directly in Podman

version: '3.8'

services:
  # ========================================================================
  # CUSTOM SERVICES (We Build)
  # ========================================================================

  # API Gateway Service
  api-gateway:
    build:
      context: ../..
      dockerfile: deploy/podman-compose/Dockerfile.api-gateway
    container_name: iaas-api-gateway
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=iaas-api-gateway
      - APP_PORT=8000
      - CONTROL_PLANE_URL=http://control-plane:8001
      - FAILOVER_MANAGER_URL=http://failover-manager:8002
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/iaas
      - REDIS_URL=redis://redis:6379/0
      - NATS_URL=nats://nats:4222
      - JWT_SECRET=dev-secret-change-in-production
      - LOG_LEVEL=DEBUG
    volumes:
      - ../../src:/app/src:ro
    depends_on:
      - postgres
      - redis
      - nats
      - control-plane
      - failover-manager
    networks:
      - iaas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Control Plane Service
  control-plane:
    build:
      context: ../..
      dockerfile: deploy/podman-compose/Dockerfile.control-plane
    container_name: iaas-control-plane
    ports:
      - "8001:8001"
    environment:
      - APP_NAME=iaas-control-plane
      - APP_PORT=8001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/iaas
      - REDIS_URL=redis://redis:6379/0
      - NATS_URL=nats://nats:4222
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=False
      - CROSSPLANE_API_URL=http://localhost:8080  # Will be on host, not in container network
      - LOG_LEVEL=DEBUG
    volumes:
      - ../../src:/app/src:ro
    depends_on:
      - postgres
      - redis
      - nats
      - minio
    networks:
      - iaas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Failover Manager Service
  failover-manager:
    build:
      context: ../..
      dockerfile: deploy/podman-compose/Dockerfile.failover-manager
    container_name: iaas-failover-manager
    ports:
      - "8002:8002"
    environment:
      - APP_NAME=iaas-failover-manager
      - APP_PORT=8002
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/iaas
      - REDIS_URL=redis://redis:6379/0
      - NATS_URL=nats://nats:4222
      - CONTROL_PLANE_URL=http://control-plane:8001
      - CHECK_INTERVAL_SECONDS=30
      - FAILOVER_THRESHOLD=3
      - LOG_LEVEL=DEBUG
    volumes:
      - ../../src:/app/src:ro
    depends_on:
      - postgres
      - redis
      - nats
      - control-plane
    networks:
      - iaas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ========================================================================
  # EXISTING TOOLS (We Leverage)
  # ========================================================================

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: iaas-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=iaas
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - iaas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: iaas-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - iaas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # NATS Message Queue (replaces RabbitMQ)
  nats:
    image: nats:2-alpine
    container_name: iaas-nats
    ports:
      - "4222:4222"
      - "8222:8222"  # HTTP monitoring
    command: ["-js", "-sd", "/data"]  # Enable JetStream
    volumes:
      - nats-data:/data
    networks:
      - iaas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nats-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: iaas-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - iaas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: iaas-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../../deploy/podman-compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - iaas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: iaas-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - iaas-network
    restart: unless-stopped
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================================================
  # KUBERNETES FOR CROSSPLANE (Optional - for local Crossplane testing)
  # ========================================================================
  # Note: Crossplane requires Kubernetes. For local development:
  # Option 1: Use Kind (Kubernetes in Docker) - uncomment below
  # Option 2: Use existing Kubernetes cluster (recommended for production)
  # Option 3: Skip Crossplane in local dev, use mock
  #
  # To use Kind:
  # 1. Install Kind on host: https://kind.sigs.k8s.io/
  # 2. Create cluster: kind create cluster --name iaas-crossplane
  # 3. Install Crossplane: kubectl crossplane install
  # 4. Install providers: kubectl crossplane provider install <provider>
  #
  # For this compose file, we'll use a mock Crossplane API for development
  # In production, Crossplane runs in its own Kubernetes cluster

  # Mock Crossplane API (for development without Kubernetes)
  crossplane-mock:
    image: python:3.11-slim
    container_name: iaas-crossplane-mock
    ports:
      - "8080:8080"
    volumes:
      - ../../scripts/crossplane_mock:/app
    working_dir: /app
    command: python -m http.server 8080
    networks:
      - iaas-network
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  nats-data:
  minio-data:
  prometheus-data:
  grafana-data:

networks:
  iaas-network:
    driver: bridge
